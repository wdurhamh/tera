<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Lakes &amp; Observations</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <div id="controls">
    <div class="card-header" id="controls-toggle">
      <span>Filters</span><span class="chevron">▾</span>
    </div>
    <div class="card-body">
      <label>Species
        <input id="species" placeholder="e.g. Rainbow Trout" />
      </label>
      <label>Min length (inches)
        <input id="min_length" type="number" step="0.1" placeholder="10" />
      </label>
      <div class="btn-row">
        <button id="apply" class="primary">Apply</button>
        <button id="reset">Reset</button>
      </div>
    </div>
  </div>

  <div id="map"></div>

  <div id="panel">
    <div id="panel-header">
      <button id="back-btn">← Back</button>
      <span id="panel-title">Waters in view</span>
      <span id="panel-status"></span>
      <span class="chevron" id="panel-toggle" title="Collapse/expand">▾</span>
    </div>
    <div id="panel-body">
      <div id="panel-list"></div>
      <div id="panel-detail"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
  <script src="app.js"></script>
</body>
</html>
